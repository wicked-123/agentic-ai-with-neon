<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Live insights and chart dashboard powered by AI agents.">
    <title>Live Dashboard | viggy's data retrieval AI</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script src="/static/utils.js?v=2"></script>
    <!-- Chart.js for rendering visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        /* ── Dashboard-specific overrides ───────────────────────── */
        /* Inheriting full width from style.css */

        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        /* ── Charts Grid: horizontal, left-aligned, wrapping ──── */
        .charts-section-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.2rem;
            text-shadow: none;
        }

        .charts-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: flex-start;
            align-items: flex-start;
        }

        /* ── Insights Section ─────────────────────────────────── */
        .insights-section-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.2rem;
            margin-top: 0.5rem;
            text-shadow: 0 0 10px var(--primary-light);
        }

        .insights-list {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: flex-start;
            align-items: flex-start;
        }

        /* Back to Home link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            transition: gap 0.2s;
        }
        .back-link:hover { gap: 0.7rem; }

        /* ── Insight Card ───────────────────────────────────────── */
        .insight-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary);
            padding: 1.5rem;
            border-radius: 14px;
            box-shadow: var(--glass-shadow);
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            width: calc(25vw - 1.5rem);
            min-width: 300px;
            height: 30vh;
            overflow: auto;
            resize: both;
            max-width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .insight-card h3 { color: var(--primary); margin-bottom: 0.6rem; font-size: 1.05rem; }
        .insight-card .q-text { font-weight: 600; color: var(--text-main); margin-bottom: 0.5rem; font-size: 0.95rem; }
        .insight-card .i-text { color: var(--text-muted); font-style: italic; font-size: 0.9rem; }

        /* ── Chart Card (compact, side-by-side) ─────────────────── */
        .chart-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1rem 1.2rem;
            box-shadow: var(--glass-shadow);
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            width: calc(25vw - 1.5rem);
            min-width: 300px;
            height: 30vh;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            resize: both;
            max-width: 100%;
            max-height: 90vh;
            transition: box-shadow 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }
        .chart-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.15), 0 0 15px var(--accent-light);
        }
        .card-controls {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            display: flex;
            gap: 0.2rem;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }
        .chart-card:hover .card-controls,
        .insight-card:hover .card-controls {
            opacity: 1;
        }
        .control-btn {
            background: transparent;
            border: none;
            border-radius: 4px;
            padding: 0.3rem 0.4rem;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }
        .control-btn:hover {
            background: rgba(128, 128, 128, 0.1);
            color: var(--text-main);
        }
        .control-btn.close-btn:hover {
            background: rgba(220, 38, 38, 0.1);
            color: #DC2626;
        }
        .card-minimized {
            height: 3.5rem !important;
            min-height: 3.5rem !important;
            overflow: hidden !important;
            resize: none !important;
            padding-bottom: 0 !important;
        }
        .card-minimized > *:not(.card-title):not(.card-controls) {
            display: none !important;
        }
        .chart-card .chart-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.25rem;
            text-shadow: 0 0 10px var(--accent-light);
        }
        .chart-card .chart-question {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
            line-height: 1.4;
        }
        .chart-card canvas {
            flex: 1;
            max-height: 100%;
        }

        /* ── Shared ─────────────────────────────────────────────── */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-12px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            padding: 4rem 2rem;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
        }

        .empty-state span {
            display: block;
            font-size: 2.5rem;
            margin-bottom: 0.8rem;
        }

        #status {
            position: absolute;
            top: 2rem;
            right: 2rem;
            font-weight: 600;
            color: var(--accent-dark);
            background: var(--accent-light);
            padding: 0.6rem 1.2rem;
            border-radius: 999px;
            border: 1px solid var(--accent);
            box-shadow: var(--glass-shadow);
            font-size: 0.9rem;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--primary-light);
            border: 1px solid var(--primary);
            color: var(--primary-dark);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            margin-top: 0.8rem;
        }
        
        .btn-home:hover {
            background: var(--primary);
            color: white;
        }

        /* ── Modal Overlay ──────────────────────────────────────── */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 16px;
            width: 85vw;
            height: 85vh;
            padding: 2rem;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            background: transparent;
            border: none;
            font-size: 2.5rem;
            line-height: 1;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
            z-index: 10;
        }

        .close-modal:hover {
            color: var(--text-main);
        }

        .modal-chart-wrapper {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div style="display:flex; align-items:center; gap:0.8rem;">
                <h1 style="display:flex; align-items:center; gap:0.5rem;">
                    <img src="/static/live dashboard.png" width="32" height="32" alt="Dashboard Icon"> 
                    Live Insights Dashboard
                </h1>
            </div>
            <p>Real-time business insights and charts from user queries</p>
            <a href="/" class="btn-home">
                ← Back to Home
            </a>
        </header>

        <main>
            <div id="status">🟢 Listening for live queries...</div>

            <div class="feed-container" id="feedContainer">
                <div class="empty-state" id="emptyState">
                    <span>🔎</span>
                    Waiting for the first query on the main page...<br>
                    Data insights and charts will appear here in real time.
                </div>

                <!-- Charts section: horizontal grid -->
                <div class="charts-section-title" id="chartsSectionTitle" style="display:none; align-items:center; gap:0.5rem;">
                    <img src="/static/icons8-chart-96.png" width="24" height="24" alt="Charts"> Charts
                </div>
                <div class="charts-grid" id="chartsGrid"></div>

                <!-- Insights section: vertical stack -->
                <div class="insights-section-title" id="insightsSectionTitle" style="display:none; align-items:center; gap:0.5rem;">
                    <img src="/static/insights.gif" width="24" height="24" alt="Insights"> Insights
                </div>
                <div class="insights-list" id="insightsList"></div>
            </div>
        </main>
    </div>

    <!-- Modal Overlay for Expanded Chart -->
    <div id="chartModal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <button id="closeModalBtn" class="close-modal">&times;</button>
            <div class="modal-chart-wrapper" style="overflow-x:auto; overflow-y:hidden;">
                <div id="modalChartInner" style="height:100%; min-width:100%; position:relative;">
                    <canvas id="modalCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/dashboard.js?v=3"></script>
</body>
</html>
